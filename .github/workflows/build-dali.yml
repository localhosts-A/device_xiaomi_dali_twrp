name: Build Dali TWRP recovery fragment

on:
  workflow_dispatch:
    inputs:
      device_tree_ref:
        description: Private device-tree commit or ref to build (blank uses twrp-16.0)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dali-twrp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build vendor_boot recovery fragment
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out the private Dali device tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: localhosts-A/device_xiaomi_dali
          ref: ${{ inputs.device_tree_ref || 'twrp-16.0' }}
          path: private-tree
          ssh-key: ${{ secrets.PRIVATE_DEVICE_TREE_DEPLOY_KEY }}
          persist-credentials: false
          submodules: false

      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/node_modules
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo apt-get purge -y '^ghc-.*' '^dotnet-.*' '^llvm-.*' \
            azure-cli google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Android and TWRP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick libc6-dev-i386 \
            lib32readline-dev lib32z1-dev libelf-dev libgl1-mesa-dev \
            liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils \
            linux-modules-extra-$(uname -r) \
            lzop pngcrush python3 python-is-python3 repo rsync schedtool \
            squashfs-tools unzip x11proto-core-dev libx11-dev xsltproc zip \
            zlib1g-dev
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          repo version
          df -h /

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-dali-twrp16-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ccache-dali-twrp16-

      - name: Configure ccache
        run: |
          mkdir -p "$HOME/.cache/ccache"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=$(command -v ccache)" >> "$GITHUB_ENV"
          ccache -M 5G
          ccache -s

      - name: Configure 32 GB compressed swap
        run: |
          sudo modprobe zram num_devices=1
          device="$(sudo zramctl --find --size 32G)"
          sudo mkswap "$device"
          sudo swapon --priority 100 "$device"
          echo "Configured 32 GiB zram swap on $device"
          sudo zramctl "$device"
          free -h
          swapon --show
          df -h /

      - name: Sync TWRP 16.0 source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init --depth=1 \
            -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git \
            -b twrp-16.0
          repo sync -c --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune -j"$(nproc --all)"
          df -h /

      - name: Place the private device tree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp/device/xiaomi"
          cp -a "$GITHUB_WORKSPACE/private-tree" \
            "$GITHUB_WORKSPACE/twrp/device/xiaomi/dali"
          rm -rf "$GITHUB_WORKSPACE/twrp/device/xiaomi/dali/.git"
          rm -rf "$GITHUB_WORKSPACE/private-tree"

      - name: Apply the device's pinned TWRP source patch
        run: |
          recovery_project="$GITHUB_WORKSPACE/twrp/bootable/recovery"
          device_tree="$GITHUB_WORKSPACE/twrp/device/xiaomi/dali"
          git -C "$recovery_project" fetch --depth=1 \
            https://github.com/TeamWin/android_bootable_recovery.git \
            640eae012e65e9058baf8a8480ea5f0e4850fd3c
          git -C "$recovery_project" checkout --detach FETCH_HEAD
          git -C "$recovery_project" apply --check \
            "$device_tree/patches/bootable-recovery.patch"
          git -C "$recovery_project" apply \
            "$device_tree/patches/bootable-recovery.patch"

      - name: Build recovery fragment
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_dali bp2a eng
          ccache -z
          trap 'ccache -s || true' EXIT
          mka vendorbootimage -j"$(nproc --all)"

      - name: Verify output and write a build summary
        run: |
          image="$GITHUB_WORKSPACE/twrp/out/target/product/dali/vendor_boot.img"
          test -s "$image"
          {
            echo "## Dali TWRP build"
            echo
            echo "- Output: vendor_boot recovery fragment"
            echo "- Size: $(stat -c '%s bytes' "$image")"
            echo "- SHA-256: $(sha256sum "$image" | cut -d ' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-dali-twrp16-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove private source and build output
        if: ${{ always() }}
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-tree" "$GITHUB_WORKSPACE/twrp"
