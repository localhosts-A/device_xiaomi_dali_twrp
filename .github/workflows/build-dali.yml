name: Build Dali TWRP recovery fragment

on:
  workflow_dispatch:
    inputs:
      device_tree_ref:
        description: Private device-tree commit or branch to build
        required: false
        default: twrp-16.0
        type: string
      trigger_repository:
        description: Repository that requested this build (metadata only)
        required: false
        type: string
      trigger_sha:
        description: Commit SHA in the requesting repository (metadata only)
        required: false
        type: string
      upload_fragment:
        description: Upload the image to this public repository (may expose private ramdisk resources)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dali-twrp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build vendor_boot recovery fragment
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out the private Dali device tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: localhosts-A/device_xiaomi_dali
          ref: ${{ inputs.device_tree_ref || 'twrp-16.0' }}
          path: private-tree
          ssh-key: ${{ secrets.PRIVATE_DEVICE_TREE_DEPLOY_KEY }}
          persist-credentials: false
          submodules: false

      - name: Test LK protection before syncing Android source
        run: |
          recovery_project="$RUNNER_TEMP/lk-test-recovery"
          device_tree="$GITHUB_WORKSPACE/private-tree"
          git init "$recovery_project"
          git -C "$recovery_project" fetch --depth=1 \
            https://github.com/TeamWin/android_bootable_recovery.git \
            640eae012e65e9058baf8a8480ea5f0e4850fd3c
          git -C "$recovery_project" checkout --detach FETCH_HEAD
          while read -r project patch extra; do
            [ "$project" = bootable/recovery ] || continue
            git -C "$recovery_project" apply --check "$device_tree/patches/$patch"
            git -C "$recovery_project" apply "$device_tree/patches/$patch"
          done < "$device_tree/patches/series"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I "$recovery_project/twrpinstall" \
            "$recovery_project/twrpinstall/lk_protection.cpp" \
            "$device_tree/tests/lk-protection-test.cpp" \
            -o "$RUNNER_TEMP/lk-protection-test"
          sudo modprobe loop || true
          sudo "$RUNNER_TEMP/lk-protection-test"
          rm -rf "$recovery_project"

      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/node_modules
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo apt-get purge -y '^ghc-.*' '^dotnet-.*' '^llvm-.*' \
            azure-cli google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Android and TWRP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick libc6-dev-i386 \
            lib32readline-dev lib32z1-dev libelf-dev libgl1-mesa-dev \
            liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush python3 python-is-python3 repo rsync schedtool \
            squashfs-tools unzip x11proto-core-dev libx11-dev xsltproc zip \
            zlib1g-dev
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          repo version
          df -h /

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-dali-twrp16-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ccache-dali-twrp16-v2-
            ${{ runner.os }}-ccache-dali-twrp16-

      - name: Configure ccache
        id: configure-ccache
        run: |
          mkdir -p "$HOME/.cache/ccache"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=$(command -v ccache)" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE/twrp" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          ccache -M 5G
          ccache -o compression=true
          ccache -s

      - name: Configure swap
        run: |
          if sudo modprobe zram num_devices=1 && device="$(sudo zramctl --find --size 32G)"; then
            sudo mkswap "$device"
            sudo swapon --priority 100 "$device"
            echo "Configured 32 GiB zram swap on $device"
            sudo zramctl "$device"
          else
            echo "::warning::zram is unavailable; using 8 GiB disk-backed swap"
            swapfile="$RUNNER_TEMP/dali-build.swap"
            sudo fallocate -l 8G "$swapfile"
            sudo chmod 600 "$swapfile"
            sudo mkswap "$swapfile"
            sudo swapon --priority 10 "$swapfile"
          fi
          free -h
          swapon --show
          df -h /

      - name: Sync TWRP 16.0 source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init --depth=1 \
            -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git \
            -b twrp-16.0
          repo sync -c --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune -j"$(nproc --all)"
          df -h /

      - name: Place the private device tree
        run: |
          echo "DALI_DEVICE_TREE_SHA=$(git -C "$GITHUB_WORKSPACE/private-tree" rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/twrp/device/xiaomi"
          cp -a "$GITHUB_WORKSPACE/private-tree" \
            "$GITHUB_WORKSPACE/twrp/device/xiaomi/dali"
          rm -rf "$GITHUB_WORKSPACE/twrp/device/xiaomi/dali/.git"
          rm -rf "$GITHUB_WORKSPACE/private-tree"

      - name: Apply the device's ordered source patches
        run: |
          recovery_project="$GITHUB_WORKSPACE/twrp/bootable/recovery"
          device_tree="$GITHUB_WORKSPACE/twrp/device/xiaomi/dali"
          git -C "$recovery_project" fetch --depth=1 \
            https://github.com/TeamWin/android_bootable_recovery.git \
            640eae012e65e9058baf8a8480ea5f0e4850fd3c
          git -C "$recovery_project" checkout --detach FETCH_HEAD
          sh "$device_tree/tools/apply-source-patches.sh" "$GITHUB_WORKSPACE/twrp"

      - name: Build recovery fragment
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_dali bp2a eng
          ccache -z
          trap 'ccache -s || true' EXIT
          mka vendorbootimage -j"$(nproc --all)"

      - name: Verify output and write a build summary
        env:
          TRIGGER_REPOSITORY: ${{ inputs.trigger_repository }}
          TRIGGER_SHA: ${{ inputs.trigger_sha }}
        run: |
          image="$GITHUB_WORKSPACE/twrp/out/target/product/dali/vendor_boot.img"
          fragment_source="$GITHUB_WORKSPACE/twrp/out/target/product/dali/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio.lz4"
          fragment="$GITHUB_WORKSPACE/twrp/out/target/product/dali/recovery.cpio.lz4"
          recovery="$GITHUB_WORKSPACE/twrp/out/target/product/dali/recovery/root/system/bin/recovery"
          test -s "$image"
          test -s "$fragment_source"
          cp "$fragment_source" "$fragment"
          for marker in 'LK protection enabled' 'OS2.0.220.0' 'OS3.0.307.0' 'OS4.0.0.7/4.0.0.8'; do
            grep -aFq "$marker" "$recovery" || {
              echo "::error::Compiled recovery is missing feature marker: $marker"
              exit 1
            }
          done
          cd "$(dirname "$image")"
          sha256sum vendor_boot.img recovery.cpio.lz4 > SHA256SUMS
          {
            echo "## Dali TWRP build"
            echo
            echo "- Output: vendor_boot recovery fragment"
            echo "- Device tree commit: $DALI_DEVICE_TREE_SHA"
            echo "- LK isolation integration test: passed"
            echo "- Size: $(stat -c '%s bytes' "$image")"
            echo "- SHA-256: $(sha256sum "$image" | cut -d ' ' -f1)"
            if [[ "$TRIGGER_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "- Trigger repository: $TRIGGER_REPOSITORY"
            fi
            if [[ "$TRIGGER_SHA" =~ ^[0-9a-fA-F]{7,64}$ ]]; then
              echo "- Trigger commit: $TRIGGER_SHA"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record ccache statistics
        if: ${{ always() && steps.configure-ccache.outcome == 'success' }}
        run: |
          ccache -s > "$RUNNER_TEMP/dali-ccache-stats.txt"
          {
            echo "## Compiler cache"
            echo
            echo '- 5 GiB compressed ccache; previous runs restored by prefix.'
            echo '- Compiler identity uses executable content; source paths use CCACHE_BASEDIR.'
            echo '```text'
            cat "$RUNNER_TEMP/dali-ccache-stats.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save ccache, including failed builds
        if: ${{ always() && steps.configure-ccache.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-dali-twrp16-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload recovery fragment
        if: ${{ inputs.upload_fragment }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dali-vendor-boot-fragment-${{ github.run_number }}
          path: |
            twrp/out/target/product/dali/vendor_boot.img
            twrp/out/target/product/dali/recovery.cpio.lz4
            twrp/out/target/product/dali/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

      - name: Remove private source and build output
        if: ${{ always() }}
        run: |
          sudo swapoff "$RUNNER_TEMP/dali-build.swap" 2>/dev/null || true
          sudo rm -f "$RUNNER_TEMP/dali-build.swap"
          rm -rf "$GITHUB_WORKSPACE/private-tree" "$GITHUB_WORKSPACE/twrp"
